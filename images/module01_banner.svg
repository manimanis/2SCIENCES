<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="120">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd" />
      <stop offset="100%" stop-color="#0a58ca" />
    </linearGradient>
    <linearGradient id="boxG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="160" rx="12" fill="url(#bg1)" />
  
  <!-- Flow Diagram Shapes -->
  <!-- Step 1: Entrées -->
  <rect x="30" y="55" width="80" height="50" rx="8" fill="url(#boxG)" stroke="#ffffff" stroke-width="2" />
  <text x="70" y="85" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Entrées</text>

  <!-- Arrow 1 -->
  <path d="M 115 80 L 140 80" stroke="#ffc107" stroke-width="3" marker-end="url(#arr)" />
  <polygon points="140,75 150,80 140,85" fill="#ffc107" />

  <!-- Step 2: Traitement -->
  <rect x="155" y="45" width="90" height="70" rx="8" fill="#ffffff" fill-opacity="0.9" />
  <text x="200" y="78" fill="#0d6efd" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Traitement</text>
  <text x="200" y="96" fill="#0d6efd" font-family="sans-serif" font-size="11" text-anchor="middle">⚙ Algorithme</text>

  <!-- Arrow 2 -->
  <path d="M 250 80 L 275 80" stroke="#ffc107" stroke-width="3" />
  <polygon points="275,75 285,80 275,85" fill="#ffc107" />

  <!-- Step 3: Sorties -->
  <rect x="290" y="55" width="80" height="50" rx="8" fill="url(#boxG)" stroke="#ffffff" stroke-width="2" />
  <text x="330" y="85" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Sorties</text>

  <!-- Top Badge -->
  <rect x="140" y="12" width="120" height="22" rx="11" fill="#ffffff" fill-opacity="0.2" />
  <text x="200" y="27" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Résolution 4 Étapes</text>
</svg>
