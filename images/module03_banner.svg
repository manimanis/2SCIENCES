<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="120">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="160" rx="12" fill="url(#bg3)" />

  <!-- Data Grid Cards -->
  <!-- Card 1: Numeric int/float -->
  <rect x="40" y="40" width="95" height="80" rx="8" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1.5" />
  <text x="87" y="68" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">int / float</text>
  <text x="87" y="92" fill="#fef3c7" font-family="monospace" font-size="12" text-anchor="middle">3.14  |  42</text>

  <!-- Card 2: Logic Gate AND/OR -->
  <rect x="152" y="40" width="95" height="80" rx="8" fill="#ffffff" fill-opacity="0.9" />
  <text x="200" y="65" fill="#b45309" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Porte ET/OU</text>
  <text x="200" y="85" fill="#b45309" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">L = a.c̄ + b.c</text>
  <circle cx="200" cy="103" r="6" fill="#10b981" />

  <!-- Card 3: ASCII str -->
  <rect x="265" y="40" width="95" height="80" rx="8" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1.5" />
  <text x="312" y="68" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">ASCII &amp; str</text>
  <text x="312" y="92" fill="#fef3c7" font-family="monospace" font-size="12" text-anchor="middle">'A' ➔ 65</text>
</svg>
