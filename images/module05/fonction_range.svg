<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="auto">
  <defs>
    <style>
      .title-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .param-box { font-family: 'Consolas', 'Courier New', monospace; font-size: 16px; font-weight: 700; }
      .label-inclus { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #16a34a; text-anchor: middle; }
      .label-exclus { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
      .label-pas { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #d97706; text-anchor: middle; }
      .val-text { font-family: 'Consolas', monospace; font-size: 14px; font-weight: 700; text-anchor: middle; }
      .sub-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
    </style>
    <marker id="arrow-range" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <g>
    <!-- Code Signature Card -->
    <rect x="50" y="15" width="500" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="300" y="46" class="param-box" fill="#f8fafc" text-anchor="middle">
      range(<tspan fill="#4ade80">debut</tspan>, <tspan fill="#f87171">fin</tspan>, <tspan fill="#fbbf24">pas</tspan>)
    </text>

    <!-- Pointers to Parameters -->
    <!-- Debut Pointer -->
    <path d="M 180 65 L 120 105" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-range)"/>
    <rect x="60" y="110" width="120" height="40" rx="5" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
    <text x="120" y="128" class="label-inclus">Inclus (Inclusif)</text>
    <text x="120" y="142" class="sub-text">1ère valeur</text>

    <!-- Fin Pointer -->
    <path d="M 300 65 L 300 105" stroke="#f87171" stroke-width="2" marker-end="url(#arrow-range)"/>
    <rect x="235" y="110" width="130" height="40" rx="5" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
    <text x="300" y="128" class="label-exclus">Exclus (Stricte !)</text>
    <text x="300" y="142" class="sub-text">Arrêt avant 'fin'</text>

    <!-- Pas Pointer -->
    <path d="M 420 65 L 480 105" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow-range)"/>
    <rect x="420" y="110" width="120" height="40" rx="5" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="480" y="128" class="label-pas">Pas (Incrément)</text>
    <text x="480" y="142" class="sub-text">Par défaut = 1</text>

    <!-- Example Sequence Bar: range(0, 10, 2) -->
    <rect x="50" y="170" width="500" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="70" y="202" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#0284c7">Exemple range(0, 10, 2) :</text>

    <!-- Values -->
    <!-- 0 -->
    <circle cx="230" cy="197" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="230" y="202" class="val-text" fill="#15803d">0</text>
    <!-- 2 -->
    <circle cx="280" cy="197" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="280" y="202" class="val-text" fill="#15803d">2</text>
    <!-- 4 -->
    <circle cx="330" cy="197" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="330" y="202" class="val-text" fill="#15803d">4</text>
    <!-- 6 -->
    <circle cx="380" cy="197" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="202" class="val-text" fill="#15803d">6</text>
    <!-- 8 -->
    <circle cx="430" cy="197" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="430" y="202" class="val-text" fill="#15803d">8</text>
    <!-- 10 Excluded -->
    <circle cx="490" cy="197" r="15" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="490" y="202" class="val-text" fill="#b91c1c">10</text>
    <line x1="480" y1="187" x2="500" y2="207" stroke="#dc2626" stroke-width="2"/>
    <text x="490" y="222" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">Exclus</text>
  </g>
</svg>
