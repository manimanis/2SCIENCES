<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="100%" height="auto">
  <defs>
    <style>
      .cond-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0369a1; text-anchor: middle; }
      .proc-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .init-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .label-vrai { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #16a34a; }
      .label-faux { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #dc2626; }
      .flow-line { stroke: #475569; stroke-width: 2; fill: none; }
      .loop-line { stroke: #0284c7; stroke-width: 2; fill: none; stroke-dasharray: 4,3; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <g>
    <!-- Title / Badge -->
    <rect x="140" y="8" width="240" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="260" y="29" class="init-text">Initialisation : cpt ← Vi</text>

    <!-- Arrow from Init to Condition -->
    <line x1="260" y1="40" x2="260" y2="63" class="flow-line" marker-end="url(#arrow)"/>

    <!-- Condition Diamond -->
    <polygon points="260,65 340,95 260,125 180,95" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="260" y="100" class="cond-text">cpt ≤ Vf ?</text>

    <!-- VRAI Branch (Down) -->
    <line x1="260" y1="125" x2="260" y2="158" class="flow-line" marker-end="url(#arrow)"/>
    <text x="268" y="145" class="label-vrai">Vrai</text>

    <!-- Traitement Box -->
    <rect x="180" y="160" width="160" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="260" y="185" class="proc-text">Bloc d'instructions</text>

    <!-- Arrow from Traitement to Increment -->
    <line x1="260" y1="202" x2="260" y2="223" class="flow-line" marker-end="url(#arrow)"/>

    <!-- Increment Box -->
    <rect x="180" y="225" width="160" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="260" y="248" class="init-text">cpt ← cpt + Pas</text>

    <!-- Loop Back Line (Left side) -->
    <path d="M 180 243 L 100 243 L 100 95 L 172 95" class="loop-line" marker-end="url(#arrow-blue)"/>
    <text x="105" y="165" font-family="'Segoe UI', sans-serif" font-size="11" fill="#0284c7" font-weight="600" transform="rotate(-90 105 165)">Itération suivante</text>

    <!-- FAUX Branch (Right side) -->
    <path d="M 340 95 L 430 95 L 430 280 L 350 280" class="flow-line" marker-end="url(#arrow)"/>
    <text x="355" y="88" class="label-faux">Faux</text>

    <!-- Exit / End Box -->
    <rect x="170" y="265" width="180" height="32" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="260" y="286" class="init-text" font-weight="700">Fin de la boucle (Fin Pour)</text>
  </g>
</svg>
