<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <!-- Shadows -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="hdr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="calc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="cond-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="sol2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="sol1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <linearGradient id="sol0-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#f8fafc" rx="12" />

  <!-- Header Card -->
  <rect x="20" y="20" width="860" height="54" rx="8" fill="url(#hdr-grad)" filter="url(#drop-shadow)" />
  <text x="450" y="53" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="18">
    📐 Arbre de décision : Équation du 2nd degré (a · x² + b · x + c = 0)
  </text>

  <!-- Step 1: Calculate Delta -->
  <g filter="url(#drop-shadow)">
    <rect x="300" y="90" width="300" height="50" rx="10" fill="url(#calc-grad)" stroke="#0284c7" stroke-width="2" />
    <text x="450" y="112" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">
      1. Calcul du Discriminant (Δ)
    </text>
    <text x="450" y="132" text-anchor="middle" fill="#e0f2fe" font-family="Consolas, monospace" font-weight="bold" font-size="16">
      Δ ← b * b - 4 * a * c
    </text>
  </g>

  <!-- Arrow Step 1 -> Decision -->
  <path d="M 450 140 L 450 170" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Decision Node: Evaluation de Delta -->
  <polygon points="450,172 560,215 450,258 340,215" fill="url(#cond-grad)" filter="url(#drop-shadow)" />
  <text x="450" y="210" text-anchor="middle" fill="#ffffff" font-family="Consolas, monospace" font-weight="bold" font-size="16">
    Signe de Δ ?
  </text>
  <text x="450" y="230" text-anchor="middle" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="12">
    (Δ &gt; 0, Δ = 0, Δ &lt; 0)
  </text>

  <!-- 3 Branch Lines -->
  <!-- Left: Delta > 0 -->
  <path d="M 340 215 L 160 215 L 160 285" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)" />
  <rect x="185" y="190" width="70" height="22" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5" />
  <text x="220" y="206" text-anchor="middle" fill="#047857" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">
    Δ &gt; 0
  </text>

  <!-- Middle: Delta = 0 -->
  <path d="M 450 258 L 450 285" stroke="#0891b2" stroke-width="2.5" fill="none" marker-end="url(#arrow-cyan)" />
  <rect x="415" y="260" width="70" height="20" rx="4" fill="#cff4fc" stroke="#0891b2" stroke-width="1.5" />
  <text x="450" y="274" text-anchor="middle" fill="#0e7490" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">
    Δ = 0
  </text>

  <!-- Right: Delta < 0 -->
  <path d="M 560 215 L 740 215 L 740 285" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#arrow-red)" />
  <rect x="645" y="190" width="70" height="22" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="680" y="206" text-anchor="middle" fill="#b91c1c" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">
    Δ &lt; 0
  </text>

  <!-- Result Card 1: Delta > 0 (Deux solutions) -->
  <g filter="url(#drop-shadow)">
    <rect x="30" y="290" width="260" height="165" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2.5" />
    <rect x="30" y="290" width="260" height="38" rx="8" fill="url(#sol2-grad)" />
    <text x="160" y="314" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">
      Deux Solutions (S = {x₁, x₂})
    </text>
    <text x="160" y="348" text-anchor="middle" fill="#065f46" font-family="Consolas, monospace" font-weight="bold" font-size="13">
      x₁ ← (-b - √Δ) / (2*a)
    </text>
    <text x="160" y="370" text-anchor="middle" fill="#065f46" font-family="Consolas, monospace" font-weight="bold" font-size="13">
      x₂ ← (-b + √Δ) / (2*a)
    </text>
    <line x1="50" y1="385" x2="270" y2="385" stroke="#e2e8f0" stroke-width="1" />
    <text x="160" y="408" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12">
      Ex: x² - 3x + 2 = 0 (Δ = 1)
    </text>
    <text x="160" y="430" text-anchor="middle" fill="#047857" font-family="Consolas, monospace" font-weight="bold" font-size="13">
      x₁ = 1.0 , x₂ = 2.0
    </text>
  </g>

  <!-- Result Card 2: Delta = 0 (Solution double) -->
  <g filter="url(#drop-shadow)">
    <rect x="320" y="290" width="260" height="165" rx="10" fill="#ffffff" stroke="#06b6d4" stroke-width="2.5" />
    <rect x="320" y="290" width="260" height="38" rx="8" fill="url(#sol1-grad)" />
    <text x="450" y="314" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">
      Solution Double (S = {x₀})
    </text>
    <text x="450" y="358" text-anchor="middle" fill="#0e7490" font-family="Consolas, monospace" font-weight="bold" font-size="15">
      x₀ ← -b / (2*a)
    </text>
    <line x1="340" y1="385" x2="560" y2="385" stroke="#e2e8f0" stroke-width="1" />
    <text x="450" y="408" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12">
      Ex: x² - 4x + 4 = 0 (Δ = 0)
    </text>
    <text x="450" y="430" text-anchor="middle" fill="#0e7490" font-family="Consolas, monospace" font-weight="bold" font-size="13">
      x₀ = 2.0
    </text>
  </g>

  <!-- Result Card 3: Delta < 0 (Pas de solution) -->
  <g filter="url(#drop-shadow)">
    <rect x="610" y="290" width="260" height="165" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2.5" />
    <rect x="610" y="290" width="260" height="38" rx="8" fill="url(#sol0-grad)" />
    <text x="740" y="314" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">
      Pas de Solution dans ℝ (S = ∅)
    </text>
    <text x="740" y="358" text-anchor="middle" fill="#b91c1c" font-family="Consolas, monospace" font-weight="bold" font-size="15">
      Équation impossible
    </text>
    <line x1="630" y1="385" x2="850" y2="385" stroke="#e2e8f0" stroke-width="1" />
    <text x="740" y="408" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12">
      Ex: x² + x + 1 = 0 (Δ = -3)
    </text>
    <text x="740" y="430" text-anchor="middle" fill="#b91c1c" font-family="Consolas, monospace" font-weight="bold" font-size="13">
      S = ∅
    </text>
  </g>

</svg>
