<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>

    <linearGradient id="hdr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Markers for coordinate axes -->
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="500" fill="#f8fafc" rx="12" />

  <!-- Header -->
  <rect x="20" y="20" width="880" height="54" rx="8" fill="url(#hdr-grad)" filter="url(#drop-shadow)" />
  <text x="460" y="53" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="18">
    📏 Position relative &amp; intersection de deux droites affines (y = a · x + b)
  </text>

  <!-- Left: Geometric Classification Diagram (4 Cases) -->
  <g transform="translate(25, 95)">
    <!-- Case 1: Confondues -->
    <g filter="url(#drop-shadow)">
      <rect x="0" y="0" width="190" height="180" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
      <rect x="0" y="0" width="190" height="34" rx="7" fill="#64748b" />
      <text x="95" y="22" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">1. Confondues</text>
      <!-- Grid -->
      <line x1="20" y1="105" x2="170" y2="105" stroke="#f1f5f9" stroke-width="1" />
      <line x1="95" y1="42" x2="95" y2="168" stroke="#f1f5f9" stroke-width="1" />
      <!-- Overlapping Lines -->
      <line x1="30" y1="145" x2="160" y2="65" stroke="#2563eb" stroke-width="4" />
      <line x1="30" y1="145" x2="160" y2="65" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" />
      <text x="95" y="165" text-anchor="middle" fill="#475569" font-family="Consolas, monospace" font-size="11">a₁=a₂ et b₁=b₂</text>
    </g>

    <!-- Case 2: Parallèles -->
    <g transform="translate(205, 0)" filter="url(#drop-shadow)">
      <rect x="0" y="0" width="190" height="180" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <rect x="0" y="0" width="190" height="34" rx="7" fill="#0284c7" />
      <text x="95" y="22" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">2. Parallèles</text>
      <line x1="20" y1="105" x2="170" y2="105" stroke="#f1f5f9" stroke-width="1" />
      <line x1="95" y1="42" x2="95" y2="168" stroke="#f1f5f9" stroke-width="1" />
      <!-- Parallel Lines F and G -->
      <line x1="30" y1="130" x2="160" y2="50" stroke="#2563eb" stroke-width="2.5" />
      <text x="150" y="46" fill="#2563eb" font-family="sans-serif" font-weight="bold" font-size="12">F</text>
      <line x1="30" y1="160" x2="160" y2="80" stroke="#0284c7" stroke-width="2.5" />
      <text x="150" y="76" fill="#0284c7" font-family="sans-serif" font-weight="bold" font-size="12">G</text>
      <text x="95" y="165" text-anchor="middle" fill="#0369a1" font-family="Consolas, monospace" font-size="11">a₁=a₂ et b₁≠b₂</text>
    </g>

    <!-- Case 3: Orthogonales -->
    <g transform="translate(0, 195)" filter="url(#drop-shadow)">
      <rect x="0" y="0" width="190" height="180" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
      <rect x="0" y="0" width="190" height="34" rx="7" fill="#10b981" />
      <text x="95" y="22" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">3. Orthogonales</text>
      <line x1="20" y1="105" x2="170" y2="105" stroke="#f1f5f9" stroke-width="1" />
      <line x1="95" y1="42" x2="95" y2="168" stroke="#f1f5f9" stroke-width="1" />
      <!-- Perpendicular lines F & I -->
      <line x1="45" y1="150" x2="145" y2="50" stroke="#2563eb" stroke-width="2.5" />
      <line x1="45" y1="50" x2="145" y2="150" stroke="#ef4444" stroke-width="2.5" />
      <!-- Right angle square at intersection (95, 100) -->
      <path d="M 95 90 L 105 100 L 95 110" fill="none" stroke="#10b981" stroke-width="2" />
      <circle cx="95" cy="100" r="3.5" fill="#10b981" />
      <text x="95" y="165" text-anchor="middle" fill="#047857" font-family="Consolas, monospace" font-size="11">a₁ * a₂ = -1</text>
    </g>

    <!-- Case 4: Sécantes -->
    <g transform="translate(205, 195)" filter="url(#drop-shadow)">
      <rect x="0" y="0" width="190" height="180" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="0" y="0" width="190" height="34" rx="7" fill="#f59e0b" />
      <text x="95" y="22" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">4. Sécantes</text>
      <line x1="20" y1="105" x2="170" y2="105" stroke="#f1f5f9" stroke-width="1" />
      <line x1="95" y1="42" x2="95" y2="168" stroke="#f1f5f9" stroke-width="1" />
      <!-- Secant lines I & H -->
      <line x1="30" y1="68" x2="160" y2="135" stroke="#ef4444" stroke-width="2.5" />
      <line x1="30" y1="145" x2="160" y2="65" stroke="#8b5cf6" stroke-width="2.5" />
      <!-- Intersection Point E -->
      <circle cx="95" cy="100" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
      <text x="104" y="94" fill="#b45309" font-family="sans-serif" font-weight="bold" font-size="11">E(x, y)</text>
      <text x="95" y="165" text-anchor="middle" fill="#b45309" font-family="Consolas, monospace" font-size="11">a₁ ≠ a₂</text>
    </g>
  </g>

  <!-- Right: Course Example Coordinate System Grid -->
  <g transform="translate(440, 95)" filter="url(#drop-shadow)">
    <rect x="0" y="0" width="455" height="375" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="0" y="0" width="455" height="36" rx="9" fill="#1e293b" />
    <text x="227" y="23" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">
      📌 Repère cartésien : Les 4 droites du cours (F, G, H, I)
    </text>

    <!-- Grid lines -->
    <g stroke="#f1f5f9" stroke-width="1">
      <line x1="30" y1="90" x2="425" y2="90" />
      <line x1="30" y1="140" x2="425" y2="140" />
      <line x1="30" y1="190" x2="425" y2="190" />
      <line x1="30" y1="240" x2="425" y2="240" />
      <line x1="30" y1="290" x2="425" y2="290" />

      <line x1="85" y1="50" x2="85" y2="335" />
      <line x1="145" y1="50" x2="145" y2="335" />
      <line x1="205" y1="50" x2="205" y2="335" />
      <line x1="265" y1="50" x2="265" y2="335" />
      <line x1="325" y1="50" x2="325" y2="335" />
      <line x1="385" y1="50" x2="385" y2="335" />
    </g>

    <!-- Axes (Origin O at 205, 190) & Graduations -->
    <line x1="30" y1="190" x2="425" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-axis)" />
    <line x1="205" y1="335" x2="205" y2="50" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-axis)" />
    
    <text x="196" y="204" fill="#334155" font-family="Consolas, monospace" font-size="11">O</text>
    <text x="418" y="182" fill="#64748b" font-family="sans-serif" font-weight="bold" font-size="12">x</text>
    <text x="193" y="58" fill="#64748b" font-family="sans-serif" font-weight="bold" font-size="12">y</text>

    <!-- X-Axis Graduations -->
    <line x1="85" y1="186" x2="85" y2="194" stroke="#475569" stroke-width="1.5" />
    <text x="85" y="206" fill="#64748b" text-anchor="middle" font-family="Consolas, monospace" font-size="10">-2</text>

    <line x1="145" y1="186" x2="145" y2="194" stroke="#475569" stroke-width="1.5" />
    <text x="145" y="206" fill="#64748b" text-anchor="middle" font-family="Consolas, monospace" font-size="10">-1</text>

    <line x1="265" y1="186" x2="265" y2="194" stroke="#475569" stroke-width="1.5" />
    <text x="265" y="206" fill="#64748b" text-anchor="middle" font-family="Consolas, monospace" font-size="10">1</text>

    <line x1="325" y1="186" x2="325" y2="194" stroke="#475569" stroke-width="1.5" />
    <text x="325" y="206" fill="#64748b" text-anchor="middle" font-family="Consolas, monospace" font-size="10">2</text>

    <line x1="385" y1="186" x2="385" y2="194" stroke="#475569" stroke-width="1.5" />
    <text x="385" y="206" fill="#64748b" text-anchor="middle" font-family="Consolas, monospace" font-size="10">3</text>

    <!-- Y-Axis Graduations -->
    <line x1="201" y1="90" x2="209" y2="90" stroke="#475569" stroke-width="1.5" />
    <text x="195" y="93" fill="#64748b" text-anchor="end" font-family="Consolas, monospace" font-size="10">2</text>

    <line x1="201" y1="140" x2="209" y2="140" stroke="#475569" stroke-width="1.5" />
    <text x="195" y="143" fill="#64748b" text-anchor="end" font-family="Consolas, monospace" font-size="10">1</text>

    <line x1="201" y1="240" x2="209" y2="240" stroke="#475569" stroke-width="1.5" />
    <text x="195" y="243" fill="#64748b" text-anchor="end" font-family="Consolas, monospace" font-size="10">-1</text>

    <line x1="201" y1="290" x2="209" y2="290" stroke="#475569" stroke-width="1.5" />
    <text x="195" y="293" fill="#64748b" text-anchor="end" font-family="Consolas, monospace" font-size="10">-2</text>

    <!-- Lines plotted according to course equations -->
    <!-- Line F: f(x) = 2x - 1 (Blue) -->
    <line x1="115" y1="320" x2="280" y2="50" stroke="#2563eb" stroke-width="2.5" />
    <rect x="255" y="65" width="115" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1" />
    <text x="312" y="80" text-anchor="middle" fill="#1e40af" font-family="Consolas, monospace" font-weight="bold" font-size="11">F: y = 2x - 1</text>

    <!-- Line G: g(x) = 2x + 2 (Cyan) -->
    <line x1="85" y1="320" x2="250" y2="50" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6,3" />
    <rect x="135" y="45" width="115" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
    <text x="192" y="60" text-anchor="middle" fill="#0369a1" font-family="Consolas, monospace" font-weight="bold" font-size="11">G: y = 2x + 2</text>

    <!-- Line H: h(x) = 0.5x + 1 (Purple) -->
    <line x1="45" y1="250" x2="385" y2="125" stroke="#8b5cf6" stroke-width="2.5" />
    <rect x="295" y="115" width="125" height="22" rx="4" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1" />
    <text x="357" y="130" text-anchor="middle" fill="#6b21a8" font-family="Consolas, monospace" font-weight="bold" font-size="11">H: y = 0.5x + 1</text>

    <!-- Line I: i(x) = -0.5x - 1.5 (Red) -->
    <line x1="45" y1="125" x2="385" y2="295" stroke="#ef4444" stroke-width="2.5" />
    <rect x="295" y="280" width="130" height="22" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1" />
    <text x="360" y="295" text-anchor="middle" fill="#991b1b" font-family="Consolas, monospace" font-weight="bold" font-size="11">I: y = -0.5x - 1.5</text>

    <!-- Intersection Point B (F ∩ I): (-0.2, -1.4) -->
    <circle cx="199" cy="232" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
    <rect x="75" y="245" width="145" height="22" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1" />
    <text x="147" y="260" text-anchor="middle" fill="#047857" font-family="Consolas, monospace" font-weight="bold" font-size="11">B(-0.2, -1.4) [F ⊥ I]</text>

    <!-- Intersection Point E (I ∩ H): (-2.5, -0.25) -->
    <circle cx="130" cy="198" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
    <rect x="35" y="172" width="150" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
    <text x="110" y="187" text-anchor="middle" fill="#b45309" font-family="Consolas, monospace" font-weight="bold" font-size="11">E(-2.5, -0.25) [I ∩ H]</text>

    <!-- Bottom summary banner -->
    <rect x="15" y="342" width="425" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="227" y="358" text-anchor="middle" fill="#334155" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">
      F ∥ G (Parallèles) | F ⊥ I (Orthogonales) | I ∩ H (Sécantes en E)
    </text>
  </g>
</svg>
