<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" height="auto">
  <defs>
    <style>
      .title-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .cond-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #0369a1; text-anchor: middle; }
      .cond-danger { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #b91c1c; text-anchor: middle; }
      .node-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .label-vrai { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #16a34a; }
      .label-faux { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; }
      .flow-line { stroke: #475569; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow-calc" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Title Pill / Entry -->
  <rect x="250" y="10" width="180" height="34" rx="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="340" y="32" class="title-text">Saisir ch ("A op B")</text>
  <line x1="340" y1="44" x2="340" y2="63" class="flow-line" marker-end="url(#arrow-calc)"/>

  <!-- Extraction Box -->
  <rect x="220" y="65" width="240" height="42" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="340" y="90" class="node-text">Extraire A, op (+,-,*,/) et B de ch</text>
  <line x1="340" y1="107" x2="340" y2="128" class="flow-line" marker-end="url(#arrow-calc)"/>

  <!-- Decision 1: op = '/' ? -->
  <polygon points="340,130 410,155 340,180 270,155" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="340" y="159" class="cond-text">op = '/' ?</text>

  <!-- Branch Non (op != '/') -> Simple Op (+, -, *) -->
  <line x1="270" y1="155" x2="140" y2="155" class="flow-line"/>
  <line x1="140" y1="155" x2="140" y2="228" class="flow-line" marker-end="url(#arrow-calc)"/>
  <text x="195" y="148" class="label-faux">Non (+, -, *)</text>

  <rect x="60" y="230" width="160" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="140" y="256" class="node-text">res ← A op B</text>

  <!-- Branch Oui (op == '/') -> Check B = 0 -->
  <line x1="410" y1="155" x2="490" y2="155" class="flow-line"/>
  <line x1="490" y1="155" x2="490" y2="183" class="flow-line" marker-end="url(#arrow-calc)"/>
  <text x="430" y="148" class="label-vrai">Oui ( / )</text>

  <!-- Decision 2: B = 0 ? -->
  <polygon points="490,185 560,210 490,235 420,210" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="490" y="214" class="cond-danger">B = 0 ?</text>

  <!-- B = 0 Oui -> Affichage Erreur "Division par zéro" -->
  <line x1="560" y1="210" x2="600" y2="210" class="flow-line"/>
  <line x1="600" y1="210" x2="600" y2="308" class="flow-line" marker-end="url(#arrow-calc)"/>
  <text x="568" y="202" class="label-vrai">Oui</text>

  <rect x="500" y="310" width="170" height="42" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="585" y="335" class="node-text" fill="#dc2626">Ecrire("Division par zéro")</text>

  <!-- B = 0 Non -> Division valide (res <- A / B) -->
  <line x1="420" y1="210" x2="340" y2="210" class="flow-line"/>
  <line x1="340" y1="210" x2="340" y2="228" class="flow-line" marker-end="url(#arrow-calc)"/>
  <text x="375" y="202" class="label-faux">Non</text>

  <rect x="270" y="230" width="140" height="44" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="256" class="node-text">res ← A / B</text>

  <!-- Rejoindre les calculs valides (res) vers l'affichage de résultat -->
  <polyline points="140,274 140,310 240,310" class="flow-line"/>
  <polyline points="340,274 340,310 240,310" class="flow-line"/>
  <line x1="240" y1="310" x2="240" y2="328" class="flow-line" marker-end="url(#arrow-calc)"/>

  <rect x="150" y="330" width="180" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="240" y="356" class="node-text">Ecrire(ch, " = ", res)</text>

  <!-- Point de sortie / FIN -->
  <polyline points="240,372 240,400 585,400 585,352" class="flow-line"/>
  <circle cx="412" cy="400" r="10" fill="#0f172a"/>
  <circle cx="412" cy="400" r="5" fill="#ffffff"/>
  <text x="412" y="385" class="title-text" style="font-size: 11px;">FIN</text>
</svg>
