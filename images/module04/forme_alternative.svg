<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" width="100%" height="auto">
  <defs>
    <style>
      .cond-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #15803d; text-anchor: middle; }
      .proc1-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #14532d; text-anchor: middle; }
      .proc2-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #7f1d1d; text-anchor: middle; }
      .label-vrai { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #16a34a; }
      .label-faux { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #dc2626; }
      .flow-line { stroke: #475569; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow-alt" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <g>
    <!-- Entry Arrow -->
    <line x1="190" y1="10" x2="190" y2="33" class="flow-line" marker-end="url(#arrow-alt)"/>

    <!-- Condition Diamond -->
    <polygon points="190,35 265,65 190,95 115,65" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="190" y="70" class="cond-text">n mod 2 = 0</text>

    <!-- Branch VRAI (Left) -->
    <polyline points="115,65 85,65 85,143" class="flow-line" marker-end="url(#arrow-alt)"/>
    <text x="90" y="57" class="label-vrai">Vrai</text>

    <!-- Traitement 1 Box -->
    <rect x="10" y="145" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="85" y="172" class="proc1-text">Ecrire(n, "est pair.")</text>

    <!-- Branch FAUX (Right) -->
    <polyline points="265,65 295,65 295,143" class="flow-line" marker-end="url(#arrow-alt)"/>
    <text x="270" y="57" class="label-faux">Faux</text>

    <!-- Traitement 2 Box -->
    <rect x="220" y="145" width="150" height="46" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="295" y="172" class="proc2-text">Ecrire(n, "est impair.")</text>

    <!-- Rejoin Lines -->
    <polyline points="85,191 85,215 180,215" class="flow-line"/>
    <polyline points="295,191 295,215 200,215" class="flow-line"/>

    <!-- Exit Line -->
    <line x1="190" y1="215" x2="190" y2="240" class="flow-line" marker-end="url(#arrow-alt)"/>
    <circle cx="190" cy="215" r="4" fill="#475569"/>
  </g>
</svg>
