<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <!-- Shadows -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="hdr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="valid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="equi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="rect-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="iso-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="invalid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#f8fafc" rx="12" />

  <!-- Header Card -->
  <rect x="20" y="20" width="860" height="54" rx="8" fill="url(#hdr-grad)" filter="url(#drop-shadow)" />
  <text x="450" y="53" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="18">
    📐 Classification géométrique : Nature d'un Triangle (a, b, c)
  </text>

  <!-- Step 1 Card: Inegalite triangulaire -->
  <g filter="url(#drop-shadow)">
    <rect x="30" y="94" width="840" height="74" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <rect x="30" y="94" width="840" height="30" rx="8" fill="url(#valid-grad)" />
    <text x="450" y="114" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">
      1. Condition d'existence (Inégalité triangulaire)
    </text>
    <text x="450" y="146" text-anchor="middle" fill="#1e293b" font-family="Consolas, monospace" font-weight="bold" font-size="15">
      (a + b &gt; c) et (a + c &gt; b) et (b + c &gt; a)
    </text>
  </g>

  <!-- 4 Type Cards Grid -->

  <!-- Card 1: Non Triangle -->
  <g filter="url(#drop-shadow)">
    <rect x="30" y="195" width="195" height="260" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2" />
    <rect x="30" y="195" width="195" height="36" rx="8" fill="url(#invalid-grad)" />
    <text x="127" y="218" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">
      Non Triangle
    </text>

    <!-- Visual Icon -->
    <path d="M 65 310 L 115 310 M 135 310 L 185 270" stroke="#ef4444" stroke-width="3" stroke-dasharray="4" />
    <circle cx="125" cy="310" r="4" fill="#ef4444" />
    <text x="127" y="335" text-anchor="middle" fill="#b91c1c" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">
      Ne se ferment pas
    </text>

    <line x1="45" y1="355" x2="210" y2="355" stroke="#e2e8f0" stroke-width="1" />
    <text x="127" y="378" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12">
      Condition non vérifiée
    </text>
    <text x="127" y="400" text-anchor="middle" fill="#b91c1c" font-family="Consolas, monospace" font-weight="bold" font-size="12">
      Ex: a=1, b=1, c=3
    </text>
    <text x="127" y="425" text-anchor="middle" fill="#991b1b" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">
      1 + 1 = 2 ≯ 3
    </text>
  </g>

  <!-- Card 2: Equilaterial -->
  <g filter="url(#drop-shadow)">
    <rect x="245" y="195" width="195" height="260" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" />
    <rect x="245" y="195" width="195" height="36" rx="8" fill="url(#equi-grad)" />
    <text x="342" y="218" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">
      Équilatéral
    </text>

    <!-- Visual Shape -->
    <polygon points="342,250 292,320 392,320" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2.5" />
    <text x="342" y="340" text-anchor="middle" fill="#6d28d9" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">
      3 côtés égaux
    </text>

    <line x1="260" y1="355" x2="425" y2="355" stroke="#e2e8f0" stroke-width="1" />
    <text x="342" y="378" text-anchor="middle" fill="#475569" font-family="Consolas, monospace" font-weight="bold" font-size="12">
      a = b et b = c
    </text>
    <text x="342" y="400" text-anchor="middle" fill="#6d28d9" font-family="Consolas, monospace" font-weight="bold" font-size="12">
      Ex: a=3, b=3, c=3
    </text>
    <text x="342" y="425" text-anchor="middle" fill="#5b21b6" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">
      Angles = 60°
    </text>
  </g>

  <!-- Card 3: Rectangle -->
  <g filter="url(#drop-shadow)">
    <rect x="460" y="195" width="195" height="260" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <rect x="460" y="195" width="195" height="36" rx="8" fill="url(#rect-grad)" />
    <text x="557" y="218" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">
      Rectangle (Pythagore)
    </text>

    <!-- Visual Shape -->
    <polygon points="505,250 505,320 595,320" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" />
    <rect x="505" y="308" width="12" height="12" fill="none" stroke="#1d4ed8" stroke-width="1.5" />
    <text x="557" y="340" text-anchor="middle" fill="#1d4ed8" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">
      Angle droit (90°)
    </text>

    <line x1="475" y1="355" x2="640" y2="355" stroke="#e2e8f0" stroke-width="1" />
    <text x="557" y="378" text-anchor="middle" fill="#475569" font-family="Consolas, monospace" font-weight="bold" font-size="11">
      a*a + b*b = c*c
    </text>
    <text x="557" y="400" text-anchor="middle" fill="#1d4ed8" font-family="Consolas, monospace" font-weight="bold" font-size="12">
      Ex: a=3, b=4, c=5
    </text>
    <text x="557" y="425" text-anchor="middle" fill="#1e40af" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">
      9 + 16 = 25
    </text>
  </g>

  <!-- Card 4: Isocele -->
  <g filter="url(#drop-shadow)">
    <rect x="675" y="195" width="195" height="260" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" />
    <rect x="675" y="195" width="195" height="36" rx="8" fill="url(#iso-grad)" />
    <text x="772" y="218" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">
      Isocèle
    </text>

    <!-- Visual Shape -->
    <polygon points="772,250 732,320 812,320" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5" />
    <text x="772" y="340" text-anchor="middle" fill="#047857" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">
      2 côtés égaux
    </text>

    <line x1="690" y1="355" x2="855" y2="355" stroke="#e2e8f0" stroke-width="1" />
    <text x="772" y="378" text-anchor="middle" fill="#475569" font-family="Consolas, monospace" font-weight="bold" font-size="11">
      a = b ou a = c ou b = c
    </text>
    <text x="772" y="400" text-anchor="middle" fill="#047857" font-family="Consolas, monospace" font-weight="bold" font-size="12">
      Ex: a=2, b=2, c=3
    </text>
    <text x="772" y="425" text-anchor="middle" fill="#065f46" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">
      2 angles égaux
    </text>
  </g>

</svg>
