<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="auto">
  <defs>
    <style>
      .title-main { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .zone-neg { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
      .zone-pos { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #16a34a; text-anchor: middle; }
      .axis-line { stroke: #334155; stroke-width: 3.5; stroke-linecap: round; }
      .tick-line { stroke: #475569; stroke-width: 2; }
      .tick-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .badge-pair { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .badge-impair { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .legend-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
    </style>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="25" class="title-main">Axe des Entiers Relatifs (ℤ) : Signe &amp; Parité</text>

  <!-- ZONE SIGNE (Top Regions) -->
  <!-- Zone Négative (n < 0) -->
  <rect x="50" y="40" width="290" height="36" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="195" y="63" class="zone-neg">◀ ENTIERS NÉGATIFS (n &lt; 0)</text>

  <!-- Zone Positive (n >= 0) -->
  <rect x="350" y="40" width="300" height="36" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="500" y="63" class="zone-pos">ENTIERS POSITIFS (n ≥ 0) ▶</text>

  <!-- MAIN NUMBER LINE AXIS -->
  <line x1="40" y1="120" x2="660" y2="120" class="axis-line" marker-start="url(#arrow-left)" marker-end="url(#arrow-right)"/>

  <!-- Zero Highlight -->
  <line x1="350" y1="102" x2="350" y2="138" stroke="#0284c7" stroke-width="3.5"/>
  <circle cx="350" cy="120" r="5" fill="#0284c7"/>

  <!-- Ticks and Numbers (-5 to 5) -->
  <!-- -5 (Impair) -->
  <line x1="100" y1="110" x2="100" y2="130" class="tick-line"/>
  <text x="100" y="102" class="tick-num">-5</text>
  <circle cx="100" cy="155" r="14" fill="#f97316"/>
  <text x="100" y="159" class="badge-impair">Imp</text>

  <!-- -4 (Pair) -->
  <line x1="150" y1="110" x2="150" y2="130" class="tick-line"/>
  <text x="150" y="102" class="tick-num">-4</text>
  <circle cx="150" cy="155" r="14" fill="#10b981"/>
  <text x="150" y="159" class="badge-pair">Pair</text>

  <!-- -3 (Impair) -->
  <line x1="200" y1="110" x2="200" y2="130" class="tick-line"/>
  <text x="200" y="102" class="tick-num">-3</text>
  <circle cx="200" cy="155" r="14" fill="#f97316"/>
  <text x="200" y="159" class="badge-impair">Imp</text>

  <!-- -2 (Pair) -->
  <line x1="250" y1="110" x2="250" y2="130" class="tick-line"/>
  <text x="250" y="102" class="tick-num">-2</text>
  <circle cx="250" cy="155" r="14" fill="#10b981"/>
  <text x="250" y="159" class="badge-pair">Pair</text>

  <!-- -1 (Impair) -->
  <line x1="300" y1="110" x2="300" y2="130" class="tick-line"/>
  <text x="300" y="102" class="tick-num">-1</text>
  <circle cx="300" cy="155" r="14" fill="#f97316"/>
  <text x="300" y="159" class="badge-impair">Imp</text>

  <!-- 0 (Pair / Origine) -->
  <text x="350" y="98" class="tick-num" fill="#0284c7">0</text>
  <circle cx="350" cy="155" r="14" fill="#10b981"/>
  <text x="350" y="159" class="badge-pair">Pair</text>

  <!-- 1 (Impair) -->
  <line x1="400" y1="110" x2="400" y2="130" class="tick-line"/>
  <text x="400" y="102" class="tick-num">1</text>
  <circle cx="400" cy="155" r="14" fill="#f97316"/>
  <text x="400" y="159" class="badge-impair">Imp</text>

  <!-- 2 (Pair) -->
  <line x1="450" y1="110" x2="450" y2="130" class="tick-line"/>
  <text x="450" y="102" class="tick-num">2</text>
  <circle cx="450" cy="155" r="14" fill="#10b981"/>
  <text x="450" y="159" class="badge-pair">Pair</text>

  <!-- 3 (Impair) -->
  <line x1="500" y1="110" x2="500" y2="130" class="tick-line"/>
  <text x="500" y="102" class="tick-num">3</text>
  <circle cx="500" cy="155" r="14" fill="#f97316"/>
  <text x="500" y="159" class="badge-impair">Imp</text>

  <!-- 4 (Pair) -->
  <line x1="550" y1="110" x2="550" y2="130" class="tick-line"/>
  <text x="550" y="102" class="tick-num">4</text>
  <circle cx="550" cy="155" r="14" fill="#10b981"/>
  <text x="550" y="159" class="badge-pair">Pair</text>

  <!-- 5 (Impair) -->
  <line x1="600" y1="110" x2="600" y2="130" class="tick-line"/>
  <text x="600" y="102" class="tick-num">5</text>
  <circle cx="600" cy="155" r="14" fill="#f97316"/>
  <text x="600" y="159" class="badge-impair">Imp</text>

  <!-- LEGEND SECTION (Bottom) -->
  <rect x="140" y="210" width="420" height="45" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Legend Item 1: Pair -->
  <circle cx="175" cy="232" r="10" fill="#10b981"/>
  <text x="195" y="236" class="legend-text"><strong>Pair</strong> : n mod 2 = 0 (ex: ..., -4, -2, 0, 2, 4, ...)</text>

  <!-- Legend Item 2: Impair -->
  <circle cx="395" cy="232" r="10" fill="#f97316"/>
  <text x="415" y="236" class="legend-text"><strong>Impair</strong> : n mod 2 ≠ 0 (ex: ..., -3, -1, 1, 3, ...)</text>
</svg>
