<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 285" width="100%" height="auto">
  <defs>
    <style>
      .cond-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #b45309; text-anchor: middle; }
      .proc1-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #78350f; text-anchor: middle; }
      .out-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .label-vrai { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #16a34a; }
      .label-faux { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #dc2626; }
      .flow-line { stroke: #475569; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow-gen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <g>
    <!-- Entry Arrow -->
    <line x1="180" y1="8" x2="180" y2="28" class="flow-line" marker-end="url(#arrow-gen)"/>

    <!-- Condition 1 Diamond -->
    <polygon points="180,30 240,55 180,80 120,55" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="180" y="59" class="cond-text">a &gt; b</text>

    <!-- Condition 1 VRAI (Left) -->
    <polyline points="120,55 75,55 75,128" class="flow-line" marker-end="url(#arrow-gen)"/>
    <text x="80" y="47" class="label-vrai">Vrai</text>

    <!-- Traitement 1 Box -->
    <rect x="25" y="130" width="100" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="75" y="155" class="proc1-text">eq ← "&gt;"</text>

    <!-- Condition 1 FAUX (Right -> Condition 2) -->
    <polyline points="240,55 315,55 315,78" class="flow-line" marker-end="url(#arrow-gen)"/>
    <text x="250" y="47" class="label-faux">Faux</text>

    <!-- Condition 2 Diamond -->
    <polygon points="315,80 375,102 315,124 255,102" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="315" y="106" class="cond-text">a &lt; b</text>

    <!-- Condition 2 VRAI (Left) -->
    <polyline points="255,102 200,102 200,168" class="flow-line" marker-end="url(#arrow-gen)"/>
    <text x="210" y="94" class="label-vrai">Vrai</text>

    <!-- Traitement 2 Box -->
    <rect x="150" y="170" width="100" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="200" y="195" class="proc1-text">eq ← "&lt;"</text>

    <!-- Condition 2 FAUX (Right) -->
    <polyline points="375,102 410,102 410,168" class="flow-line" marker-end="url(#arrow-gen)"/>
    <text x="380" y="94" class="label-faux">Faux</text>

    <!-- Traitement 3 Box -->
    <rect x="360" y="170" width="100" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="410" y="195" class="proc1-text">eq ← "="</text>

    <!-- Rejoin Lines -->
    <polyline points="75,172 75,230 220,230" class="flow-line"/>
    <polyline points="200,212 200,230 220,230" class="flow-line"/>
    <polyline points="410,212 410,230 240,230" class="flow-line"/>

    <!-- Output Box -->
    <line x1="230" y1="230" x2="230" y2="248" class="flow-line" marker-end="url(#arrow-gen)"/>
    <circle cx="230" cy="230" r="4" fill="#475569"/>

    <rect x="160" y="250" width="140" height="30" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="230" y="269" class="out-text">Ecrire(a, eq, b)</text>
  </g>
</svg>
