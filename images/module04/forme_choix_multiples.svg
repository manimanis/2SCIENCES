<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="auto">
  <defs>
    <style>
      .hdr-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #0369a1; text-anchor: middle; }
      .proc-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #0c4a6e; text-anchor: middle; }
      .out-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .label-val { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: 700; fill: #0284c7; text-anchor: middle; }
      .label-sinon { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
      .flow-line { stroke: #475569; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow-sel" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <g>
    <!-- Entry Arrow -->
    <line x1="270" y1="8" x2="270" y2="26" class="flow-line" marker-end="url(#arrow-sel)"/>

    <!-- Selector Header Box -->
    <rect x="200" y="28" width="140" height="38" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="270" y="52" class="hdr-text">Selon mois</text>

    <!-- Branch 1 -->
    <polyline points="270,66 70,66 70,148" class="flow-line" marker-end="url(#arrow-sel)"/>
    <text x="120" y="80" class="label-val">1,3,5,7,8,10,12</text>
    <rect x="10" y="150" width="120" height="42" rx="6" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>
    <text x="70" y="175" class="proc-text">nbjours ← 31</text>

    <!-- Branch 2 -->
    <polyline points="270,66 200,66 200,148" class="flow-line" marker-end="url(#arrow-sel)"/>
    <text x="215" y="95" class="label-val">4,6,9,11</text>
    <rect x="140" y="150" width="120" height="42" rx="6" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>
    <text x="200" y="175" class="proc-text">nbjours ← 30</text>

    <!-- Branch 3 -->
    <polyline points="270,66 330,66 330,148" class="flow-line" marker-end="url(#arrow-sel)"/>
    <text x="325" y="95" class="label-val">2</text>
    <rect x="270" y="150" width="120" height="42" rx="6" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>
    <text x="330" y="175" class="proc-text">nbjours ← 28</text>

    <!-- Branch 4 (Sinon) -->
    <polyline points="270,66 470,66 470,148" class="flow-line" marker-end="url(#arrow-sel)"/>
    <text x="440" y="80" class="label-sinon">Sinon</text>
    <rect x="410" y="150" width="120" height="42" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="470" y="175" class="proc-text" style="fill:#7f1d1d;">nbjours ← -1</text>

    <!-- Rejoin Lines -->
    <polyline points="70,192 70,225 260,225" class="flow-line"/>
    <polyline points="200,192 200,225 260,225" class="flow-line"/>
    <polyline points="330,192 330,225 280,225" class="flow-line"/>
    <polyline points="470,192 470,225 280,225" class="flow-line"/>

    <!-- Exit Line & Output Box -->
    <line x1="270" y1="225" x2="270" y2="243" class="flow-line" marker-end="url(#arrow-sel)"/>
    <circle cx="270" cy="225" r="4" fill="#475569"/>

    <rect x="200" y="245" width="140" height="30" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="270" y="264" class="out-text">Ecrire(nbjours)</text>
  </g>
</svg>
