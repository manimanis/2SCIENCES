<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="auto">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: bold; fill: #1e293b; }
      .code { font-family: monospace; font-size: 13px; font-weight: bold; fill: #0f172a; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
    </style>
    <marker id="arrow-in" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background container -->
  <rect x="5" y="5" width="590" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Left: Keyboard / User Saisie (Standard Input) -->
  <g transform="translate(30, 30)">
    <!-- Keyboard Box -->
    <rect x="0" y="0" width="180" height="110" rx="8" fill="#334155" stroke="#1e293b" stroke-width="2"/>
    <text x="15" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">⌨ Clavier (Utilisateur)</text>
    
    <!-- Key Rows Simulation -->
    <g fill="#475569" stroke="#64748b" stroke-width="1">
      <rect x="15" y="38" width="18" height="14" rx="2"/>
      <rect x="37" y="38" width="18" height="14" rx="2"/>
      <rect x="59" y="38" width="18" height="14" rx="2"/>
      <rect x="81" y="38" width="18" height="14" rx="2"/>
      <rect x="103" y="38" width="18" height="14" rx="2"/>
      <rect x="125" y="38" width="38" height="14" rx="2"/>

      <rect x="15" y="58" width="24" height="14" rx="2"/>
      <rect x="43" y="58" width="18" height="14" rx="2"/>
      <rect x="65" y="58" width="18" height="14" rx="2"/>
      <rect x="87" y="58" width="18" height="14" rx="2"/>
      <rect x="109" y="58" width="18" height="14" rx="2"/>
      <rect x="131" y="58" width="32" height="14" rx="2"/>

      <rect x="35" y="78" width="90" height="16" rx="2" fill="#64748b"/>
    </g>
    <text x="90" y="130" text-anchor="middle" class="label">Saisie au clavier (Saisie: 25)</text>
  </g>

  <!-- Middle Arrow: Lire / input -->
  <g transform="translate(220, 70)">
    <line x1="10" y1="15" x2="110" y2="15" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-in)"/>
    <text x="60" y="-2" text-anchor="middle" class="code" fill="#047857">Lire(x) / input()</text>
    <text x="60" y="32" text-anchor="middle" class="label" fill="#10b981">Transmission</text>
  </g>

  <!-- Right: RAM Memory Box (Variable storage) -->
  <g transform="translate(360, 25)">
    <!-- Variable Box (Mémoire RAM) -->
    <rect x="0" y="0" width="200" height="120" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    
    <!-- Variable Header -->
    <path d="M 0,8 C 0,3.5 3.5,0 8,0 L 192,0 C 196.5,0 200,3.5 200,8 L 200,35 L 0,35 Z" fill="#10b981"/>
    <text x="100" y="24" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Variable 'x' (Mémoire)</text>

    <!-- Value inside memory box -->
    <rect x="25" y="50" width="150" height="50" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <text x="100" y="82" text-anchor="middle" class="code" font-size="22" fill="#047857">25</text>

    <text x="100" y="145" text-anchor="middle" class="label">Stockage en mémoire RAM</text>
  </g>
</svg>
