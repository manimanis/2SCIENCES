<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="120">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#198754" />
      <stop offset="100%" stop-color="#146c43" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="160" rx="12" fill="url(#bg2)" />

  <!-- Code Terminal Screen -->
  <rect x="50" y="30" width="300" height="100" rx="8" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Window buttons -->
  <circle cx="68" cy="45" r="4" fill="#ff5f56" />
  <circle cx="82" cy="45" r="4" fill="#ffbd2e" />
  <circle cx="96" cy="45" r="4" fill="#27c93f" />

  <!-- Terminal Code -->
  <text x="70" y="70" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold"># Structures Simples</text>
  <text x="70" y="90" fill="#4ade80" font-family="monospace" font-size="13">x = int(input("Entrée ? "))</text>
  <text x="70" y="110" fill="#facc15" font-family="monospace" font-size="13">print("Sortie x =", x)</text>

  <!-- Variable Box Animation Icon -->
  <rect x="300" y="65" width="36" height="36" rx="6" fill="#198754" stroke="#4ade80" stroke-width="2" />
  <text x="318" y="88" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">x</text>
</svg>
