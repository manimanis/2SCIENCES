<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="100%" height="120">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="160" rx="12" fill="url(#bg4)" />

  <!-- Decision Diamond Icon -->
  <polygon points="200,30 250,70 200,110 150,70" fill="#ffffff" fill-opacity="0.9" />
  <text x="200" y="75" fill="#991b1b" font-family="sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Condition ?</text>

  <!-- VRAI Branch -->
  <path d="M 250 70 L 310 70 L 310 120" stroke="#4ade80" stroke-width="3" fill="none" />
  <rect x="270" y="110" width="80" height="30" rx="6" fill="#4ade80" />
  <text x="310" y="130" fill="#064e3b" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">VRAI (if)</text>

  <!-- FAUX Branch -->
  <path d="M 150 70 L 90 70 L 90 120" stroke="#f87171" stroke-width="3" fill="none" />
  <rect x="50" y="110" width="80" height="30" rx="6" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1.5" />
  <text x="90" y="130" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">FAUX (else)</text>
</svg>
