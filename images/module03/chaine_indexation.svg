<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="auto">
  <defs>
    <!-- Gradients & Shadows -->
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="grad-idx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="grad-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Outer Canvas Card -->
  <rect x="5" y="5" width="690" height="230" rx="12" fill="url(#grad-card)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title Badge -->
  <rect x="25" y="20" width="280" height="30" rx="15" fill="#e0e7ff"/>
  <text x="165" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#3730a3" text-anchor="middle">Accès aux caractères : ch ← "Youssef"</text>

  <text x="640" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#64748b" text-anchor="end">Longueur n = 7</text>

  <!-- Array Cells Container -->
  <!-- Indices row (0 to 6) -->
  <g transform="translate(60, 65)">
    <!-- Cell 0 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="url(#grad-idx)"/>
      <text x="35" y="17" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">i = 0</text>
      <rect x="0" y="32" width="70" height="60" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2" filter="url(#shadow)"/>
      <text x="35" y="70" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1e1b4b" text-anchor="middle">"Y"</text>
      <!-- Callout -->
      <path d="M 35 98 L 35 125" stroke="#4f46e5" stroke-width="2" stroke-dasharray="3,3"/>
      <rect x="5" y="125" width="60" height="22" rx="4" fill="#4f46e5"/>
      <text x="35" y="140" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">ch[0]</text>
    </g>

    <!-- Cell 1 -->
    <g transform="translate(80, 0)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="url(#grad-idx)"/>
      <text x="35" y="17" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">i = 1</text>
      <rect x="0" y="32" width="70" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="35" y="70" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#334155" text-anchor="middle">"o"</text>
      <path d="M 35 98 L 35 125" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3"/>
      <rect x="5" y="125" width="60" height="22" rx="4" fill="#0284c7"/>
      <text x="35" y="140" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">ch[1]</text>
    </g>

    <!-- Cell 2 -->
    <g transform="translate(160, 0)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="url(#grad-idx)"/>
      <text x="35" y="17" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">i = 2</text>
      <rect x="0" y="32" width="70" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="35" y="70" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#334155" text-anchor="middle">"u"</text>
    </g>

    <!-- Cell 3 -->
    <g transform="translate(240, 0)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="url(#grad-idx)"/>
      <text x="35" y="17" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">i = 3</text>
      <rect x="0" y="32" width="70" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="35" y="70" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#334155" text-anchor="middle">"s"</text>
    </g>

    <!-- Cell 4 -->
    <g transform="translate(320, 0)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="url(#grad-idx)"/>
      <text x="35" y="17" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">i = 4</text>
      <rect x="0" y="32" width="70" height="60" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="35" y="70" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#334155" text-anchor="middle">"s"</text>
    </g>

    <!-- Cell 5 -->
    <g transform="translate(400, 0)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="url(#grad-idx)"/>
      <text x="35" y="17" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">i = 5</text>
      <rect x="0" y="32" width="70" height="60" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
      <text x="35" y="70" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#0369a1" text-anchor="middle">"e"</text>
      <path d="M 35 98 L 35 125" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3"/>
      <rect x="5" y="125" width="60" height="22" rx="4" fill="#0284c7"/>
      <text x="35" y="140" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">ch[5]</text>
    </g>

    <!-- Cell 6 -->
    <g transform="translate(480, 0)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="url(#grad-idx)"/>
      <text x="35" y="17" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">i = 6</text>
      <rect x="0" y="32" width="70" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
      <text x="35" y="70" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#15803d" text-anchor="middle">"f"</text>
      <path d="M 35 98 L 35 125" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,3"/>
      <rect x="5" y="125" width="60" height="22" rx="4" fill="#16a34a"/>
      <text x="35" y="140" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">ch[6]</text>
    </g>
  </g>
</svg>
