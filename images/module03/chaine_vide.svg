<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" width="100%" height="auto">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="grad-empty" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="grad-full" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <filter id="dropshadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Outer Card -->
  <rect x="5" y="5" width="690" height="160" rx="12" fill="url(#grad-bg)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#dropshadow)"/>

  <!-- Section: Chaîne vide -->
  <!-- Label -->
  <rect x="25" y="20" width="200" height="30" rx="15" fill="#fef2f2"/>
  <text x="125" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">Chaîne vide  n = 0</text>

  <!-- Empty slot frame -->
  <rect x="25" y="62" width="72" height="64" rx="10" fill="url(#grad-empty)" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,3"/>
  <!-- No char inside – just hint text -->
  <text x="61" y="97" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">∅</text>
  <text x="61" y="112" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">(vide)</text>
  <!-- Code below -->
  <rect x="25" y="134" width="72" height="20" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="61" y="148" font-family="monospace" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">ch ← ""</text>

  <!-- Arrow connecting to explanation -->
  <path d="M 105 95 L 165 95" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="170" y="72" width="230" height="46" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="285" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#ea580c" text-anchor="middle">Aucun caractère stocké.</text>
  <text x="285" y="110" font-family="monospace" font-size="12" font-weight="bold" fill="#9a3412" text-anchor="middle">long("") ⇒ 0</text>

  <!-- Separator -->
  <line x1="430" y1="30" x2="430" y2="150" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Section: Chaîne non vide à droite (contraste) -->
  <rect x="442" y="20" width="230" height="30" rx="15" fill="#f0fdf4"/>
  <text x="557" y="40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="bold" fill="#16a34a" text-anchor="middle">Chaîne non vide  n = 5</text>

  <!-- 5 filled character cells -->
  <g transform="translate(445, 62)">
    <!-- B -->
    <rect x="0"   y="0" width="40" height="46" rx="6" fill="url(#grad-full)" stroke="#3730a3" stroke-width="1"/>
    <text x="20" y="30" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">"B"</text>
    <rect x="3"  y="51" width="34" height="18" rx="3" fill="#4f46e5"/>
    <text x="20" y="63" font-family="monospace" font-size="10" fill="#c7d2fe" text-anchor="middle">ch[0]</text>

    <!-- A -->
    <rect x="46"  y="0" width="40" height="46" rx="6" fill="url(#grad-full)" stroke="#3730a3" stroke-width="1"/>
    <text x="66" y="30" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">"A"</text>
    <rect x="49" y="51" width="34" height="18" rx="3" fill="#4f46e5"/>
    <text x="66" y="63" font-family="monospace" font-size="10" fill="#c7d2fe" text-anchor="middle">ch[1]</text>

    <!-- C -->
    <rect x="92"  y="0" width="40" height="46" rx="6" fill="url(#grad-full)" stroke="#3730a3" stroke-width="1"/>
    <text x="112" y="30" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">"C"</text>
    <rect x="95" y="51" width="34" height="18" rx="3" fill="#4f46e5"/>
    <text x="112" y="63" font-family="monospace" font-size="10" fill="#c7d2fe" text-anchor="middle">ch[2]</text>

    <!-- 2 -->
    <rect x="138" y="0" width="40" height="46" rx="6" fill="url(#grad-full)" stroke="#3730a3" stroke-width="1"/>
    <text x="158" y="30" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">"2"</text>
    <rect x="141" y="51" width="34" height="18" rx="3" fill="#4f46e5"/>
    <text x="158" y="63" font-family="monospace" font-size="10" fill="#c7d2fe" text-anchor="middle">ch[3]</text>

    <!-- 6 -->
    <rect x="184" y="0" width="40" height="46" rx="6" fill="url(#grad-full)" stroke="#3730a3" stroke-width="1"/>
    <text x="204" y="30" font-family="Georgia,serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">"6"</text>
    <rect x="187" y="51" width="34" height="18" rx="3" fill="#4f46e5"/>
    <text x="204" y="63" font-family="monospace" font-size="10" fill="#c7d2fe" text-anchor="middle">ch[4]</text>
  </g>
  <!-- Long label -->
  <text x="557" y="147" font-family="monospace" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">long("BAC26") ⇒ 5</text>
</svg>
