<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 85" width="100%" height="100%">
  <!-- ANSI Symbol (Américain) -->
  <g>
    <text x="70" y="14" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="bold">ANSI (USA)</text>
    <!-- Input wire & label -->
    <line x1="15" y1="46" x2="45" y2="46" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="15" cy="46" r="2.5" fill="#38bdf8"/>
    <text x="12" y="50" text-anchor="end" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold">x</text>
    <!-- Triangle -->
    <polygon points="45,26 85,46 45,66" fill="#dc2626" fill-opacity="0.25" stroke="#ef4444" stroke-width="2"/>
    <!-- Inversion Bubble -->
    <circle cx="91" cy="46" r="5" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <!-- Output wire & label -->
    <line x1="96" y1="46" x2="128" y2="46" stroke="#ef4444" stroke-width="2"/>
    <circle cx="128" cy="46" r="2.5" fill="#ef4444"/>
    <text x="132" y="50" text-anchor="start" fill="#ef4444" font-size="12" font-family="monospace" font-weight="bold">S=x̄</text>
  </g>

  <!-- Separator -->
  <line x1="150" y1="10" x2="150" y2="78" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- CEI Symbol (Européen) -->
  <g>
    <text x="225" y="14" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif" font-weight="bold">CEI (Europe)</text>
    <!-- Input wire & label -->
    <line x1="170" y1="46" x2="198" y2="46" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="170" cy="46" r="2.5" fill="#38bdf8"/>
    <text x="167" y="50" text-anchor="end" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold">x</text>
    <!-- Box -->
    <rect x="198" y="26" width="40" height="40" rx="3" fill="#dc2626" fill-opacity="0.25" stroke="#ef4444" stroke-width="2"/>
    <text x="218" y="52" text-anchor="middle" fill="#ffffff" font-size="16" font-family="sans-serif" font-weight="bold">1</text>
    <!-- Bubble at output -->
    <circle cx="243" cy="46" r="5" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <!-- Output wire & label -->
    <line x1="248" y1="46" x2="278" y2="46" stroke="#ef4444" stroke-width="2"/>
    <circle cx="278" cy="46" r="2.5" fill="#ef4444"/>
    <text x="282" y="50" text-anchor="start" fill="#ef4444" font-size="12" font-family="monospace" font-weight="bold">S=x̄</text>
  </g>
</svg>
