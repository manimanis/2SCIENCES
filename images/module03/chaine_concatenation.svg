<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="auto">
  <defs>
    <linearGradient id="grad-card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="grad-str1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="grad-str2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ec5d7"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="grad-str3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="grad-res" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Canvas Card -->
  <rect x="5" y="5" width="690" height="190" rx="12" fill="url(#grad-card2)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow2)"/>

  <!-- Title Badge -->
  <rect x="25" y="20" width="310" height="30" rx="15" fill="#f0fdf4"/>
  <text x="180" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">Concaténation avec l'opérateur +</text>

  <!-- Formula Expression Row -->
  <g transform="translate(45, 65)">
    <!-- Part 1: "Langage" -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="140" height="45" rx="8" fill="url(#grad-str1)" filter="url(#shadow2)"/>
      <text x="70" y="28" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">"Langage"</text>
      <text x="70" y="60" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">7 caractères</text>
    </g>

    <!-- Operator + -->
    <g transform="translate(152, 5)">
      <circle cx="16" cy="17" r="16" fill="#22c55e"/>
      <text x="16" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>
    </g>

    <!-- Part 2: "Py" -->
    <g transform="translate(195, 0)">
      <rect x="0" y="0" width="80" height="45" rx="8" fill="url(#grad-str2)" filter="url(#shadow2)"/>
      <text x="40" y="28" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">"Py"</text>
      <text x="40" y="60" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">2 char</text>
    </g>

    <!-- Operator + -->
    <g transform="translate(287, 5)">
      <circle cx="16" cy="17" r="16" fill="#22c55e"/>
      <text x="16" y="24" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>
    </g>

    <!-- Part 3: "thon" -->
    <g transform="translate(330, 0)">
      <rect x="0" y="0" width="100" height="45" rx="8" fill="url(#grad-str3)" filter="url(#shadow2)"/>
      <text x="50" y="28" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">"thon"</text>
      <text x="50" y="60" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">4 char</text>
    </g>

    <!-- Arrow ==> -->
    <g transform="translate(442, 10)">
      <text x="12" y="22" font-family="sans-serif" font-size="22" font-weight="bold" fill="#3b82f6">⇒</text>
    </g>

    <!-- Result: "LangagePython" -->
    <g transform="translate(475, -5)">
      <rect x="0" y="0" width="175" height="55" rx="10" fill="url(#grad-res)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow2)"/>
      <text x="87" y="34" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#38bdf8" text-anchor="middle">"LangagePython"</text>
      <text x="87" y="70" font-family="monospace" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">Longueur totale = 13</text>
    </g>
  </g>
</svg>
