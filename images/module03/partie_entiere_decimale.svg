<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="100%" height="auto">
  <defs>
    <style>
      .num-main { font-family: monospace, system-ui; font-size: 36px; font-weight: bold; }
      .label-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: bold; }
      .code-sub { font-family: monospace, monospace; font-size: 12px; font-weight: bold; fill: #475569; }
    </style>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1.5 L 0 5 L 10 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background Container -->
  <rect x="5" y="5" width="640" height="190" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <g transform="translate(45, 15)">
    <!-- Central Number Box: 17.75 -->
    <rect x="180" y="30" width="200" height="60" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <text x="235" y="72" class="num-main" fill="#0284c7">17</text>
    <text x="275" y="72" class="num-main" fill="#ef4444">.</text>
    <text x="290" y="72" class="num-main" fill="#d97706">75</text>

    <!-- Left Pointer Arrow: Partie Entière -->
    <path d="M 170,60 L 130,60" fill="none" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow-left)"/>
    
    <!-- Left Box: Partie Entière -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="125" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
      <text x="62" y="26" text-anchor="middle" class="label-title" fill="#0369a1">Partie entière</text>
      <text x="62" y="54" text-anchor="middle" class="num-main" font-size="28" fill="#0284c7">17</text>
      <text x="62" y="72" text-anchor="middle" class="code-sub">Ent(x) / int(x)</text>
    </g>

    <!-- Right Pointer Arrow: Partie Décimale -->
    <path d="M 390,60 L 430,60" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-right)"/>

    <!-- Right Box: Partie Décimale -->
    <g transform="translate(435, 20)">
      <rect x="0" y="0" width="125" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
      <text x="62" y="26" text-anchor="middle" class="label-title" fill="#b45309">Partie décimale</text>
      <text x="62" y="54" text-anchor="middle" class="num-main" font-size="28" fill="#d97706">0.75</text>
      <text x="62" y="72" text-anchor="middle" class="code-sub">x - Ent(x)</text>
    </g>

    <!-- Bottom Code Explanation Bar -->
    <g transform="translate(40, 125)">
      <rect x="0" y="0" width="480" height="35" rx="6" fill="#1e293b"/>
      <text x="240" y="22" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#f8fafc">
        x = <tspan fill="#38bdf8">17.75</tspan> &#160;➔&#160; Entier = <tspan fill="#38bdf8">17</tspan> &#160;|&#160; Décimal = <tspan fill="#fbbf24">0.75</tspan>
      </text>
    </g>
  </g>
</svg>
