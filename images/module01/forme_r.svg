<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 480" width="100%" height="auto">
  <defs>
    <style>
      .label-text { font-family: 'Georgia', 'Times New Roman', serif; font-size: 34px; font-weight: normal; fill: #000000; }
      .dashed-line { stroke: #111111; stroke-width: 2; stroke-dasharray: 6,5; fill: none; }
      .tick-line { stroke: #000000; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <g transform="translate(70, 60)">
    <!-- Main Outer Shape: Rectangle + Quarter Circle Arc -->
    <path d="M 0,360 
             L 220,360 
             L 220,0 
             L 100,0 
             A 100,100 0 0 0 0,100 
             Z" 
          fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="miter"/>

    <!-- Internal Dashed Line (Horizontal separator for Y) -->
    <line x1="0" y1="100" x2="220" y2="100" class="dashed-line"/>

    <!-- Internal Dashed Line (Vertical separator for X & R) -->
    <line x1="100" y1="0" x2="100" y2="100" class="dashed-line"/>

    <!-- Top Cotation Lines & Ticks -->
    <line x1="0" y1="0" x2="0" y2="-22" class="tick-line"/>
    <line x1="100" y1="0" x2="100" y2="-22" class="tick-line"/>
    <line x1="220" y1="0" x2="220" y2="-22" class="tick-line"/>

    <line x1="0" y1="-16" x2="100" y2="-16" class="tick-line"/>
    <text x="50" y="-28" text-anchor="middle" class="label-text">R</text>

    <line x1="100" y1="-16" x2="220" y2="-16" class="tick-line"/>
    <text x="160" y="-28" text-anchor="middle" class="label-text">X</text>

    <!-- Left Cotation Lines & Ticks -->
    <line x1="0" y1="0" x2="-22" y2="0" class="tick-line"/>
    <line x1="0" y1="100" x2="-22" y2="100" class="tick-line"/>
    <line x1="0" y1="360" x2="-22" y2="360" class="tick-line"/>

    <line x1="-16" y1="0" x2="-16" y2="100" class="tick-line"/>
    <text x="-38" y="62" text-anchor="middle" class="label-text">R</text>

    <line x1="-16" y1="100" x2="-16" y2="360" class="tick-line"/>
    <text x="-38" y="242" text-anchor="middle" class="label-text">Y</text>
  </g>
</svg>
